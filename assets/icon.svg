<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Vigil">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d26"/>
      <stop offset="1" stop-color="#090a0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="50%">
      <stop offset="0" stop-color="#e4a11a" stop-opacity=".26"/>
      <stop offset=".58" stop-color="#e4a11a" stop-opacity=".07"/>
      <stop offset="1" stop-color="#e4a11a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".12" y2="1">
      <stop offset="0" stop-color="#f6d06a"/>
      <stop offset=".45" stop-color="#e4a11a"/>
      <stop offset="1" stop-color="#b4780c"/>
    </linearGradient>
    <linearGradient id="gold-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c45a"/>
      <stop offset="1" stop-color="#c88810"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="480" r="400" fill="url(#glow)"/>

  <circle cx="512" cy="528" r="312" fill="#101218"/>

  <circle cx="512" cy="528" r="336" fill="none" stroke="#3a2a0c" stroke-width="70"/>
  <circle cx="512" cy="528" r="336" fill="none" stroke="url(#gold)" stroke-width="56"/>

  <!-- 12 o'clock chapter, flush with the bezel -->
  <rect x="494" y="164" width="36" height="56" rx="18" fill="url(#gold-soft)"/>

  <!-- condensed V, optically centered in the dial -->
  <path fill="url(#gold)" d="
    M 328 368
    h 92
    l 92 248
    l 92 -248
    h 92
    L 536 756
    c -6 18 -18 28 -24 28
    s -18 -10 -24 -28
    Z"/>
</svg>
