<style>
:root{
  --bg:#090a0d; --surface:#14161c; --surface2:#1c1f28; --ink:#f4f0e6; --mute:#9c968a; --line:#2c303a;
  --accent:#e4a11a; --accent-ink:#1a1204; --accent-dim:rgba(228,161,26,.14);
  --phys:#ff5d45; --ment:#6aa4ff; --soc:#3dcec0; --disc:#e4a11a; --good:#3dce7c;
  --f-display:'Avenir Next Condensed','Avenir Next','Arial Narrow',sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#e7e4dc; --surface:#fbfaf7; --surface2:#f1eee7; --ink:#16181d; --mute:#5c5850; --line:#d5d0c6;
  --accent:#8a4b00; --accent-ink:#fffaf3; --accent-dim:rgba(138,75,0,.1);
  --phys:#c4321a; --ment:#1d4fa8; --soc:#0c6e64; --disc:#8a4b00; --good:#0d7a42;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg);height:100%;touch-action:manipulation}
html,body{overscroll-behavior:none}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
body.in{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body::before{
  content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);
  background:#090a0d;z-index:20;pointer-events:none;
}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:0;line-height:1.02;font-weight:700}
h1{font-size:clamp(26px,7.2vw,36px)}
h2{font-size:26px}
h3{font-size:15px;color:var(--mute);letter-spacing:.1em}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.small{font-size:13px}
.kicker{font-family:var(--f-display);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.locked{border-color:var(--accent)}
.hero-card{position:relative;overflow:hidden}
.hero-card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit;scroll-margin-bottom:110px;scroll-margin-top:16px}
button{cursor:pointer}
input,textarea{user-select:text;-webkit-user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute);min-width:0}
input[type=text],input[type=number],select,textarea{
  background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;font-size:16px;
}
textarea{min-height:120px;resize:vertical;line-height:1.45}
input[type=range]{width:100%;padding:0;background:transparent;border:0;accent-color:var(--accent)}
.btn{
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;
  padding:14px 16px;min-height:48px;width:100%;
  font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;
}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{width:auto;flex:none;font-size:15px;padding:8px 12px;min-height:40px}
.row>.btn{width:auto;flex:1}
.btn:disabled{opacity:.45}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.link{background:none;border:0;color:var(--mute);padding:8px 0;min-height:44px;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.hero{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.herotext{min-width:0;display:flex;flex-direction:column;gap:6px}
.who{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glyph{width:18px;height:18px;color:var(--accent);display:inline-flex;flex:none}
.glyph svg{width:18px;height:18px;display:block}
.ring text{font-family:var(--f-display);fill:var(--ink)}
.pips{display:flex;gap:5px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.pips i.on{background:var(--accent)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
.chip{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--mute);background:transparent}
button.chip{min-height:32px}
.chip.hot{color:var(--accent);border-color:var(--accent)}
.quote{color:var(--mute);font-size:14px}
.pace{font-size:14px}
.promise{margin:8px 0 0;font-size:15px;color:var(--accent);line-height:1.35}
.slim h1{font-size:28px}
.lvl{font-family:var(--f-display);font-size:32px;color:var(--accent);line-height:1}
.habit{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hname{font-weight:600;overflow-wrap:anywhere}
.nameline{display:flex;align-items:center;gap:6px;min-width:0}
.nameline .hname{min-width:0}
.help{
  flex:none;width:26px;height:26px;margin-top:-1px;padding:0;border-radius:50%;
  border:1px solid var(--line);background:transparent;color:var(--mute);
  font-family:var(--f-display);font-weight:700;font-size:14px;line-height:1;
  display:grid;place-items:center;
}
.help[aria-expanded="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.hint{margin:4px 0 0;font-size:13px;line-height:1.4;color:var(--mute);font-weight:400}
.check{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.check svg{opacity:0}
.check.off{opacity:.35}
.done .check{background:var(--good);border-color:var(--good)}
.done .check svg{opacity:1}
.done .hname{color:var(--mute);text-decoration:line-through}
.xp{font-family:var(--f-mono);font-size:13px;color:var(--accent);white-space:nowrap}
.habit .link{min-height:32px;padding:2px 0;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,#888);display:inline-block;margin-right:6px}
.s-phys{--c:var(--phys)} .s-ment{--c:var(--ment)} .s-soc{--c:var(--soc)} .s-disc{--c:var(--disc)}
.editor{display:flex;flex-direction:column;gap:10px;padding:0 0 8px}
.dows{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-family:var(--f-display);font-size:16px}
.dow[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.challenge{border:1px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--accent);background:var(--accent-dim);border-radius:14px;padding:10px 12px}
.steps{display:flex;gap:6px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--line);display:block}
.steps i.on{background:var(--accent)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:12px;min-height:72px;display:flex;flex-direction:column;gap:4px}
.choice[aria-pressed="true"],.choice.on{border-color:var(--accent);background:var(--accent-dim)}
.choice{position:relative}
.areahit{position:absolute;inset:0;z-index:0;background:transparent;border:0;border-radius:inherit;padding:0}
.choice>b,.choice .ex,.choice>.hint{position:relative;z-index:1}
.choice>b,.choice .ex{pointer-events:none}
.choice .help{pointer-events:auto}
.choice b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;font-size:20px;line-height:1.05}
.choice.locked{opacity:.8}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(8px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
}
@supports (backdrop-filter:blur(8px)){
  nav{background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:saturate(140%) blur(16px)}
}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav button{
  background:none;border:0;border-radius:10px;min-height:50px;padding:6px 0 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:var(--mute);font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--accent);background:var(--surface2)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--surface2);border-radius:12px;padding:12px 12px 10px}
.metric b{font-family:var(--f-display);font-size:32px;line-height:1;display:block}
.metric span{display:block;color:var(--mute);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--f-display);margin-top:4px}
.statrow{display:grid;grid-template-columns:104px 1fr auto;gap:8px;align-items:center;font-size:14px}
.statrow .bar>i{background:var(--c)}
.radarwrap{width:min(100%,300px);margin:0 auto}
.svgwrap{width:100%}
.svgwrap svg{width:100%;height:auto;display:block}
.grid{stroke:var(--line);stroke-width:1;fill:none}
.tick{fill:var(--mute);font-family:var(--f-mono);font-size:11px}
.cell{cursor:pointer}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.timer{font-family:var(--f-display);font-size:clamp(64px,22vw,92px);line-height:.9;text-align:center;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;background:var(--surface2);border:2px solid transparent;border-radius:10px;font-family:var(--f-mono);font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.ranks .rankline{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0}
.ranks .rankline+.rankline{border-top:1px solid var(--line)}
.rankline.here{color:var(--accent)}
.toast{
  position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:999px;z-index:8;
  font-family:var(--f-display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  pointer-events:none;max-width:min(420px, calc(100% - 32px));white-space:normal;text-align:center;line-height:1.25;border-radius:16px;
}
@media (max-width:360px){
  .hero{grid-template-columns:80px 1fr;gap:10px}
  .ring{width:80px!important;height:80px!important}
  .statrow{grid-template-columns:88px 1fr auto}
}
@media (prefers-reduced-motion:no-preference){
  .bar>i{transition:width .35s ease}
  @keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
  .just .check{animation:pop .18s ease-out}
}
@media (prefers-reduced-motion:reduce){
  .just .check{animation:none}
}
</style>

    return '<button type="button" class="dow" data-act="dow" data-scope="' + scope + '" data-i="' + i + '" aria-pressed="' + (days.indexOf(i) >= 0) + '" aria-label="' + DNAMES[i] + '">' + letter + '</button>';
  }).join('') + '</div>';
}
function hintFor(name) {

  var want = String(name || '').toLowerCase(), found = '';
  Object.keys(HINTS).some(function (k) {
    if (k.toLowerCase() === want) { found = HINTS[k]; return true; }

function challengeBlock(ch) {

    '<div class="row"><button type="button" class="btn" data-act="chdone">Done</button><button type="button" class="btn ghost" data-act="chskip">Skip</button></div></div>';

function viewToday(t) {
  var d = logDate(), k = key(d);
  var todayList = activeHabits().filter(function (h) { return isSched(h, d); });
  var list = UI.manage ? activeHabits() : todayList;
  var done = todayList.filter(function (h) { return h.days[k]; }).length;
  var gain = todayList.reduce(function (a, h) { return a + (h.days[k] ? h.xp : 0); }, 0);
  var pot = todayList.reduce(function (a, h) { return a + h.xp; }, 0);
  var ch = S.challenges[k];
  if (ch && !ch.skipped) { pot += ch.xp; if (ch.done) gain += ch.xp; }
  var allDone = todayList.length > 0 && done === todayList.length && (!ch || ch.skipped || ch.done);
  var html = headerRich(t);
  if (UI.backfill) {
    html += '<div class="banner"><span>Logging <b>' + esc(fmtDay(k)) + '</b></span><button type="button" class="btn small ghost" data-act="backfill">Back to today</button></div>';
  }
  html += '<div class="card' + (allDone ? ' locked' : '') + '"><div class="row between"><h2>' + (UI.backfill ? 'That day' : 'Today') + '</h2><span class="mono small mute">' + done + '/' + todayList.length + ' · ' + gain + '/' + pot + ' XP</span></div>' +
    '<div class="bar"><i style="width:' + (pot ? Math.round(100 * gain / pot) : 0) + '%"></i></div>' +
    '<div class="kicker">' + esc(niceToday(d)) + '</div>' +
    (allDone ? '<p class="small">Day locked in.</p>' : '');
  if (ch && !ch.skipped && !ch.done) html += challengeBlock(ch);
  else if (ch && ch.done) html += '<p class="small mute">Challenge complete · +' + ch.xp + ' XP</p>';
  if (!list.length) html += '<p class="mute">' + (activeHabits().length ? 'Nothing scheduled. Take the rest day, or edit your habits.' : 'No habits yet. Add the first one.') + '</p>';
  else html += list.map(function (h) { return habitRow(h, k, d); }).join('');

    html += '<button type="button" class="btn ghost" data-act="addalcohol">Add no-alcohol habit</button><p class="small mute">Check it on days you don\'t drink. 20 Discipline XP. Edit or archive it anytime.</p>';
  }
  html += '<div class="row between"><button type="button" class="link" data-act="manage">' + (UI.manage ? 'Done editing' : 'Edit habits') + '</button>' +

  if (UI.manage || !activeHabits().length) {
    html += '<form class="card" data-form="addhabit"><h3>Add a habit</h3><label>Name<input id="nh-name" type="text" maxlength="48" required value="' + esc(UI.draft.name) + '" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"></label>' +
      '<div class="row"><label style="flex:1">Stat<select id="nh-stat">' + statOptions(UI.draft.stat) + '</select></label><label style="flex:1">XP<select id="nh-xp">' + xpOptions(UI.draft.xp) + '</select></label></div>' +
      dowPicker(UI.draft.dow, 'new') + '<button class="btn" type="submit">Add</button></form>';
  }
  if (UI.manage) {
    var archived = S.habits.filter(function (h) { return h.archived; });
    html += '<p class="small mute">Archiving keeps the XP you already earned.</p>';
    if (archived.length) {
      html += '<div class="card"><button type="button" class="link" data-act="showarch">' + (UI.showArchived ? 'Hide archived' : 'Archived (' + archived.length + ')') + '</button>';
      if (UI.showArchived) {
        html += archived.map(function (h) {
          return '<div class="row between" style="border-top:1px solid var(--line);padding:8px 0"><div style="min-width:0"><div class="hname">' + esc(h.name) + '</div><div class="small mute">' + STATS[h.stat].name + '</div></div><button type="button" class="btn small ghost" data-act="restore" data-id="' + esc(h.id) + '">Restore</button></div>';
        }).join('');
      }
      html += '</div>';
    }
  }
  return html;
}

function niceMax(m) {
  if (!(m > 1)) return 1;
  var p = Math.pow(10, Math.floor(Math.log10(m)));
  var f = m / p;
  var n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10;
  return n * p;
}
function barChart(vals, labels, color) {
  var W = 320, H = 150, L = 28, B = 22, T = 8, R = 6;
  var max = Math.max.apply(null, vals.concat([1]));
  var top = niceMax(max), pw = W - L - R, ph = H - B - T, bw = pw / vals.length;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Bar chart">';
  [0, 0.5, 1].forEach(function (f) {
    var y = T + ph - ph * f;
    s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>';
    s += '<text class="tick" x="' + (L - 4) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + Math.round(top * f) + '</text>';
  });
  vals.forEach(function (v, i) {
    var h = ph * (v / top), x = L + i * bw + bw * 0.18, hh = Math.max(h, v > 0 ? 2 : 0);
    s += '<rect x="' + x.toFixed(1) + '" y="' + (T + ph - hh).toFixed(1) + '" width="' + (bw * 0.64).toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="2" fill="' + color + '"/>';
    if (i % 2 === (vals.length - 1) % 2) s += '<text class="tick" x="' + (x + bw * 0.32).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + labels[i] + '</text>';
  });
  return s + '</svg>';
}
function radar(vals, maxv) {
  var C = 150, R = 72, W = 300, H = 300, labels = ['PHY', 'MIND', 'SOC', 'DISC'];
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Stat levels">';
  [0.25, 0.5, 0.75, 1].forEach(function (f) {
    s += '<polygon class="grid" points="' + SKEYS.map(function (_, i) {
      var a = -Math.PI / 2 + i * Math.PI / 2;
      return (C + R * f * Math.cos(a)).toFixed(1) + ',' + (C + R * f * Math.sin(a)).toFixed(1);
    }).join(' ') + '"/>';
  });
  var poly = [];
  SKEYS.forEach(function (_, i) {
    var a = -Math.PI / 2 + i * Math.PI / 2;
    s += '<line class="grid" x1="' + C + '" y1="' + C + '" x2="' + (C + R * Math.cos(a)).toFixed(1) + '" y2="' + (C + R * Math.sin(a)).toFixed(1) + '"/>';
    var lx = C + (R + 28) * Math.cos(a), ly = C + (R + 28) * Math.sin(a) + 4;
    s += '<text class="tick" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle">' + labels[i] + ' ' + vals[i] + '</text>';
    var f = Math.max(0.04, Math.min(1, vals[i] / maxv));
    poly.push((C + R * f * Math.cos(a)).toFixed(1) + ',' + (C + R * f * Math.sin(a)).toFixed(1));
  });
  s += '<polygon points="' + poly.join(' ') + '" fill="var(--accent)" fill-opacity="0.28" stroke="var(--accent)" stroke-width="2"/>';
  poly.forEach(function (p) {
    var q = p.split(',');
    s += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="3.5" fill="var(--accent)"/>';
  });
  return s + '</svg>';
}
function heat(t) {
  var cell = 16, gap = 3, label = 16, cols = 12, rows = 7;
  var W = label + cols * (cell + gap), H = rows * (cell + gap);
  var now = today();
  var mon = addDays(now, -((now.getDay() + 6) % 7));
  var start = addDays(mon, -77);
  var max = 1;
  Object.keys(t.day).forEach(function (k) { max = Math.max(max, t.day[k]); });
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Activity over the last 12 weeks">';
  [['M', 0], ['W', 2], ['F', 4]].forEach(function (pair) {
    s += '<text class="tick" x="0" y="' + (pair[1] * (cell + gap) + cell - 4) + '">' + pair[0] + '</text>';
  });
  for (var w = 0; w < cols; w++) for (var r = 0; r < rows; r++) {
    var d = addDays(start, w * 7 + r);
    if (d > now) continue;
    var v = t.day[key(d)] || 0;
    var op = v ? (0.3 + 0.7 * Math.min(v / max, 1)).toFixed(2) : '1';
    s += '<rect class="cell" data-act="heat" data-v="' + key(d) + '" x="' + (label + w * (cell + gap)) + '" y="' + (r * (cell + gap)) + '" width="' + cell + '" height="' + cell + '" rx="3" fill="' + (v ? 'var(--accent)' : 'var(--surface2)') + '" fill-opacity="' + op + '"/>';
  }
  return s + '</svg>';
}
function sleepChart() {
  var days = last(14), W = 320, H = 150, L = 32, B = 22, T = 8, R = 8, pw = W - L - R, ph = H - B - T, lo = 4, hi = 11;
  function y(v) { return T + ph - ph * (v - lo) / (hi - lo); }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Sleep hours, last 14 nights">';
  s += '<rect x="' + L + '" y="' + y(9).toFixed(1) + '" width="' + pw + '" height="' + (y(7) - y(9)).toFixed(1) + '" fill="var(--good)" fill-opacity="0.16"/>';
  [4, 6, 8, 10].forEach(function (v) {
    s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/>';
    s += '<text class="tick" x="' + (L - 4) + '" y="' + (y(v) + 3).toFixed(1) + '" text-anchor="end">' + v + 'h</text>';
  });
  var pts = [];
  days.forEach(function (d, i) {
    var v = S.sleep[key(d)], x = L + pw * (days.length === 1 ? 0 : i / (days.length - 1));
    if (v != null) pts.push([x, y(Math.min(Math.max(v, lo), hi)), v]);
    if (i % 2 === 1) s += '<text class="tick" x="' + x.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + d.getDate() + '</text>';
  });
  if (pts.length > 1) s += '<polyline fill="none" stroke="var(--ment)" stroke-width="2" points="' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"/>';
  pts.forEach(function (p) { s += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.5" fill="var(--ment)"/>'; });
  return s + '</svg>';
}
function projChart(P) {
  var W = 320, H = 170, L = 28, B = 22, T = 10, R = 8, pw = W - L - R, ph = H - B - T, N = 90;
  var rates = [[0.5, 'var(--mute)'], [0.8, 'var(--accent)'], [1, 'var(--good)']];
  function lv(x) { return lvl(x, 80); }
  var maxL = Math.max(2, lv(P * N) + 1);
  function X(d) { return L + pw * d / N; }
  function Y(level) { return T + ph - ph * (level - 1) / (maxL - 1); }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Projected level over 90 days">';
  for (var i = 0; i <= 3; i++) {
    var level = 1 + (maxL - 1) * i / 3;
    s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(level).toFixed(1) + '" y2="' + Y(level).toFixed(1) + '"/>';
    s += '<text class="tick" x="' + (L - 4) + '" y="' + (Y(level) + 3).toFixed(1) + '" text-anchor="end">' + Math.round(level) + '</text>';
  }
  [0, 30, 60, 90].forEach(function (d) { s += '<text class="tick" x="' + X(d).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">d' + d + '</text>'; });
  rates.forEach(function (r) {
    var pts = [];
    for (var d = 0; d <= N; d += 3) pts.push(X(d).toFixed(1) + ',' + Y(lv(P * r[0] * d)).toFixed(1));
    s += '<polyline fill="none" stroke="' + r[1] + '" stroke-width="2.5" points="' + pts.join(' ') + '"/>';
  });
  return s + '</svg>';
}

function viewProgress(t) {
  var sl = SKEYS.map(function (k) { return lvl(t.stat[k], 30); });
  var maxv = Math.max(2, Math.max.apply(null, sl));
  var d14 = last(14);
  var xpv = d14.map(function (d) { return t.day[key(d)] || 0; });
  var avg = Math.round(xpv.reduce(function (a, b) { return a + b; }, 0) / 14);
  var checks = 0;
  S.habits.forEach(function (h) { checks += Object.keys(h.days).length; });
  var focusMin = S.focus.reduce(function (a, f) { return a + f.min; }, 0);
  var heatNote = 'Tap a day.';
  if (UI.heat && /^\d{4}-\d{2}-\d{2}$/.test(UI.heat)) heatNote = fmtDay(UI.heat) + ' · ' + (t.day[UI.heat] || 0) + ' XP';
  return headerSlim(t) +
    '<div class="card"><h2>Record</h2><div class="metrics">' +
    '<div class="metric"><b class="mono">' + dayStreak(t) + '</b><span>day streak</span></div>' +
    '<div class="metric"><b class="mono">' + Object.keys(t.day).length + '</b><span>days logged</span></div>' +
    '<div class="metric"><b class="mono">' + checks + '</b><span>habits kept</span></div>' +
    '<div class="metric"><b class="mono">' + (focusMin / 60).toFixed(focusMin >= 600 ? 0 : 1) + '</b><span>focus hours</span></div></div></div>' +
    '<div class="card"><h2>Stats</h2><div class="radarwrap">' + radar(sl, maxv) + '</div>' +
    SKEYS.map(function (k, i) {

    }).join('') +
    '<p class="small mute">Each stat levels on its own. Higher levels ask for more XP than the last.</p></div>' +

    '<div class="card"><h2>Consistency</h2><div class="svgwrap">' + heat(t) + '</div><p class="small mute">' + esc(heatNote) + '</p></div>';

  var AC = window.AudioContext || window.webkitAudioContext;

}
function blip(freq) {
  if (!UI.sound) return;
  var ctx = armAudio();
  if (!ctx) return;
  var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
  o.type = 'sine';
  o.frequency.value = freq || 640;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.06, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + 0.12);
}
function clearChime() {

function scheduleChime(inSec) {
  clearChime();
  if (!UI.sound) return;
  var ctx = armAudio();
  if (!ctx) return;
  [0, 0.14].forEach(function (offset, i) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    var t = ctx.currentTime + Math.max(0, inSec) + offset;
    o.type = 'sine';
    o.frequency.value = i ? 880 : 660;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.22);
    chime.push(o);
  });
}

      if (xpEl && XP_CHOICES.indexOf(+xpEl.value) >= 0) h.xp = +xpEl.value;
      h.dow = UI.editDow.slice().sort(function (x, y) { return x - y; });
      if (!h.dow.length) h.dow = [0, 1, 2, 3, 4, 5, 6];
      UI.editId = null;
      persist();
    }
  } else if (a === 'dow') {
    var arr = el.dataset.scope === 'edit' ? UI.editDow : UI.draft.dow;
    var di = +el.dataset.i;
    var at = arr.indexOf(di);
    if (at >= 0) { if (arr.length > 1) arr.splice(at, 1); }
    else arr.push(di);
    arr.sort(function (x, y) { return x - y; });
    el.setAttribute('aria-pressed', arr.indexOf(di) >= 0 ? 'true' : 'false');
    skip = true;
  } else if (a === 'archive') {
    h = findHabit(id);
    if (h) { h.archived = true; if (UI.editId === id) UI.editId = null; persist(); }
  } else if (a === 'restore') {
    h = findHabit(id);
    if (h) { h.archived = false; persist(); }
  } else if (a === 'showarch') UI.showArchived = !UI.showArchived;
  else if (a === 'backfill') UI.backfill = !UI.backfill;
  else if (a === 'chdone') {
    var c = S.challenges[key(logDate())];
    if (c && !c.skipped && !c.done) {
      before = lvl(totals().xp, 80);
      c.done = 1;
      persist();
      announceLevel(before, '+' + c.xp + ' XP', 700);
    }
  } else if (a === 'chskip') {
    var cs = S.challenges[key(logDate())];
    if (cs) { cs.skipped = 1; cs.done = 0; persist(); }
  } else if (a === 'heat') { if (/^\d{4}-\d{2}-\d{2}$/.test(v || '')) UI.heat = v; }
  else if (a === 'dur') {
    if (!UI.timer.running && [15, 25, 50, 90].indexOf(+v) >= 0) { UI.timer.dur = +v; UI.timer.left = +v * 60; }
  } else if (a === 'tstart') {
    var Tm = UI.timer;
    Tm.running = true;
    Tm.date = key(today());
    Tm.left = Tm.dur * 60;
    Tm.end = Date.now() + Tm.left * 1000;
    clearInterval(tickId);
    tickId = setInterval(tick, 500);
    saveTimer();
    grabWakeLock();
    scheduleChime(Tm.left);
  } else if (a === 'tstop') { endTimer(false); skip = true; }
  else if (a === 'notify') {
    if ('Notification' in window) {
      Notification.requestPermission().then(function (p) { UI.notePerm = p; render(); });
      skip = true;
    }
  }   else if (a === 'logsleep') {
    before = lvl(totals().xp, 80);
    S.sleep[key(today())] = UI.sleepVal;
    persist();
    announceLevel(before, UI.sleepVal >= 7 && UI.sleepVal <= 9.5 ? 'Sleep logged · +10 XP' : 'Sleep logged');
  } else if (a === 'rewardlevel') {
    var rw = document.getElementById('rw-level');
    var rn = Math.round(+v);
    if (rw && rn >= 2 && rn <= 60) rw.value = String(rn);
    skip = true;
  } else if (a === 'delreward') {
    S.rewards = rewardItems().filter(function (r) { return r.id !== id; });
    persist();
  } else if (a === 'delwk') { S.workouts = S.workouts.filter(function (w) { return w.id !== id; }); persist(); }
  else if (a === 'todotoggle') {
    S.todos.forEach(function (item) { if (item.id === id) item.done = !item.done; });
    persist();
  } else if (a === 'tododel') { S.todos = S.todos.filter(function (item) { return item.id !== id; }); persist(); }
  else if (a === 'theme') setTheme(v);
  else if (a === 'sound') {
    UI.sound = !UI.sound;
    try { localStorage.setItem('dawg-sound', UI.sound ? '1' : '0'); } catch (err) {}
    if (UI.sound) blip(660);
  } else if (a === 'export') { exportBackup(); skip = true; }
  else if (a === 'copy') {
    var json = JSON.stringify(S);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(function () { markBackup(); toast('Backup copied'); }).catch(function () { fallbackCopy(json); });
    } else fallbackCopy(json);
    skip = true;
  } else if (a === 'import') { document.getElementById('import-file').click(); skip = true; }
  else if (a === 'importno') UI.pending = null;
  else if (a === 'importyes' && UI.pending) {
    S = UI.pending;
    UI.pending = null;
    S.updated = Date.now();
    UI.tab = 'today'; UI.manage = false; UI.editId = null; UI.backfill = false;
    var sv = S.sleep[key(today())];
    UI.sleepVal = sv != null ? sv : 7.5;
    keepScroll = false;
    persist();
    toast('Backup restored');
  } else if (a === 'resetask') UI.resetAsk = true;
  else if (a === 'resetno') UI.resetAsk = false;
  else if (a === 'resetyes') {
    stopAllTimer();
    S = fresh();
    UI.ob = {step: 0, name: '', arch: 'wolf', areas: ['phys', 'ment', 'disc'], inten: 'std'};
    UI.resetAsk = false; UI.manage = false; UI.editId = null; UI.backfill = false; UI.pending = null; UI.tab = 'today';
    keepScroll = false;
    persist();
  }
  if (!skip) render();
});

document.addEventListener('submit', function (e) {
  var f = e.target.dataset ? e.target.dataset.form : '';
  if (!f) return;
  e.preventDefault();
  captureFields();
  if (f === 'addhabit') {
    var name = document.getElementById('nh-name').value.trim().slice(0, 48);
    if (!name) return;
    var stat = document.getElementById('nh-stat').value;
    var xp = +document.getElementById('nh-xp').value;
    if (!STATS[stat]) stat = 'disc';
    if (XP_CHOICES.indexOf(xp) < 0) xp = 15;
    var dow = UI.draft.dow.slice().sort(function (a, b) { return a - b; });
    if (!dow.length) dow = [0, 1, 2, 3, 4, 5, 6];
    S.habits.push({id: uid(), name: name, stat: stat, xp: xp, dow: dow, days: {}});
    UI.draft = {name: '', stat: 'phys', xp: 15, dow: [0, 1, 2, 3, 4, 5, 6]};
    persist();
  } else if (f === 'workout') {
    var m = Math.round(+document.getElementById('wk-min').value);
    if (!(m >= 5 && m <= 300)) return;
    var type = document.getElementById('wk-type').value;
    if (WORKOUTS.indexOf(type) < 0) type = 'Other';
    var beforeW = lvl(totals().xp, 80);
    S.workouts.push({id: uid(), date: key(today()), type: type, min: m});
    persist();
    announceLevel(beforeW, 'Workout logged');
  } else if (f === 'focuslog') {
    var mins = Math.round(+document.getElementById('fm-min').value);
    if (!(mins >= 5 && mins <= 180)) return;
    var beforeM = lvl(totals().xp, 80);
    S.focus.push({date: key(today()), min: mins});
    persist();
    announceLevel(beforeM, mins + ' min banked');
  } else if (f === 'reward') {
    var rname = document.getElementById('rw-name').value.trim().slice(0, 48);
    var rlevel = Math.round(+document.getElementById('rw-level').value);
    if (!rname) return;
    if (!(rlevel >= 2 && rlevel <= 60)) { toast('Pick a level from 2 to 60'); return; }
    if (rewardItems().length >= 20) { toast('20 rewards is the limit'); return; }
    rewardItems().push({id: uid(), name: rname, level: rlevel, earned: 0, date: ''});
    var earnedNow = syncRewards(lvl(totals().xp, 80));
    if (!earnedNow.length) persist();
    toast(earnedNow.length ? 'You earned ' + joinNames(earnedNow.map(function (r) { return r.name; })) + '.' : 'Promised', earnedNow.length ? 4200 : 1800);
  } else if (f === 'todo') {
    var text = document.getElementById('todo-text').value.trim().slice(0, 140);
    if (!text) return;
    S.todos.unshift({id: uid(), text: text, done: false});
    if (S.todos.length > 200) S.todos.length = 200;
    persist();
  }
  render();
});

document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'sl-range') {
    UI.sleepVal = +t.value;
    var lab = document.getElementById('sl-val');
    if (lab) lab.textContent = UI.sleepVal.toFixed(1) + ' h';
    return;
  }
  if (t.id === 'journal') {
    var n = document.getElementById('jcount');
    if (n) {
      var len = t.value.trim().length;
      n.textContent = len >= 40 ? '8 Mental XP logged for today' : (40 - len) + ' characters to log XP';
    }
  }
  if (t.id === 'journal' || t.id === 'pf-name' || t.id === 'nh-name' || t.id === 'ed-name' || t.id === 'ob-name') {
    clearTimeout(capT);
    capT = setTimeout(captureFields, 280);
  }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'pf-arch' && ARCH[e.target.value]) {
    captureFields();
    S.arch = e.target.value;
    persist();
    render();
  }
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') captureFields();
  if (UI.timer.running) {
    tick();
    if (document.visibilityState === 'visible') grabWakeLock();
  }
});
document.getElementById('import-file').addEventListener('change', function (e) {
  var file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var n = normalize(JSON.parse(String(reader.result || '')));
      if (!n || !n.onboarded) { toast('That file is not a ' + APP + ' backup'); return; }
      UI.pending = n;
      UI.tab = 'you';
      render();
    } catch (err) { toast('Could not read that file'); }
  };
  reader.readAsText(file);
});

if (window.visualViewport) {
  var fitViewport = function () {
    var vv = window.visualViewport;
    var inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    var nav = document.getElementById('tabs');
    nav.style.display = inset > 140 ? 'none' : '';
  };
  window.visualViewport.addEventListener('resize', fitViewport);
  window.visualViewport.addEventListener('scroll', fitViewport);
}

var raw = readStore(LS) || readStore(LS1);
var fromV1 = !!(raw && raw.v === 1);
S = raw ? (normalize(raw) || fresh()) : fresh();
if (fromV1 && S.onboarded) persist();
var slept = S.sleep[key(today())];
if (slept != null) UI.sleepVal = slept;
try { UI.sound = localStorage.getItem('dawg-sound') === '1'; } catch (e) {}
resumeTimer();
render();
if (UI.bootNote) toast(UI.bootNote, UI.bootMs || 1800);
setInterval(function () {
  if (shownDay && key(today()) !== shownDay) { captureFields(); render(); }
}, 60000);

if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(function () {});
  });
}
})();
</script>
</body>
</html>
